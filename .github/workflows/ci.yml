name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  # E28-T02: sirlar skaneri — rasmiy gitleaks binarisi (versiya va SHA256 bilan
  # qotirilgan; uchinchi tomon action'i va litsenziya kerak emas).
  secrets:
    name: sirlar — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  dart:
    name: dart — format, generatsiya, analiz, test, qoplama
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generatsiya qilingan kod eskirmaganmi
        run: make gen-check
      - name: Format va analiz
        run: make lint
      - name: Testlar va qoplama chegarasi
        run: make coverage
      - name: Yiqilgan testlar — annotatsiyalar (loglarsiz ham ko'rinadi)
        if: failure()
        run: dart run tool/test_annotations.dart build/test-report.json

  android:
    name: android — dev APK build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gradle/manifest/flavor xatolarini ushlash
        run: >-
          flutter build apk --debug --flavor dev -t lib/main_dev.dart
          --dart-define-from-file=env/dev.example.json
