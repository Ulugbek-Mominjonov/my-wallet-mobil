# Bog'liqliklar haftalik, guruhlab yangilanadi (PR soni kam bo'lsin).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      pub:
        patterns: ["*"]
