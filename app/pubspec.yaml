name: oylik_byudjet
description: "My Wallet — oylik byudjet, qarz va maqsadlar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^6.10.0
  data_firebase:
    path: ../packages/data_firebase
  domain:
    path: ../packages/domain
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ilova ikonkasi. Qayta yaratish:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Android 8+ adaptive icon: fon — brend rangi, old qatlam — hamyon.
  adaptive_icon_background: "#1F6F54"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
